services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: conecta_app:latest
    container_name: conecta_backend
    restart: unless-stopped
    working_dir: /app
    command: python flask_api/app.py
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-conecta}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      SQLALCHEMY_DATABASE_URI: mysql+pymysql://${DB_USERNAME:-root}:${DB_PASSWORD:-root}@db:3306/${DB_DATABASE:-conecta}
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis
    networks:
      - appnet

  frontend:
    image: conecta_app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conecta_frontend
    restart: unless-stopped
    working_dir: /app/frontend-react
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - appnet

  db:
    image: mysql:8.0
    container_name: conecta_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-conecta}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-root}
    volumes:
      - ./.docker/mysql/dbdata:/var/lib/mysql
    ports:
      - "3388:3306"
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    container_name: conecta_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
